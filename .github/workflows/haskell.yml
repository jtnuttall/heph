name: Haskell CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ghc: ['9.8', '9.10', '9.12', '9.14']

    name: GHC ${{ matrix.ghc }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run fourmolu
        uses: haskell-actions/run-fourmolu@v13
        with:
          version: "0.21.0.0"

      - name: Setup Haskell environment
        id: setup
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: latest

      - name: Update package index
        run: cabal update

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: |
            ${{ steps.setup.outputs.cabal-store }}
            dist-newstyle
          key: ${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-${{ hashFiles('**/*.cabal', 'cabal.project') }}
          restore-keys: |
            ${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-

      - name: Build
        run: cabal build all --enable-tests --enable-benchmarks

      - name: Run tests
        run: cabal test all
