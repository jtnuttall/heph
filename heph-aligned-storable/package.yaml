name: heph-aligned-storable
version: 0.2.0.0
github: "jtnuttall/heph"
license: BSD-3-Clause
author: "Jeremy Nuttall"
maintainer: "jeremy@jeremy-nuttall.com"
copyright: "2025 Jeremy Nuttall"
tested-with: GHC == 9.14.1 || == 9.12.4 || == 9.10.3

extra-doc-files:
  - README.md
  - CHANGELOG.md

synopsis: Generically derive Storable instances suitable for CPU-GPU transfer
category: Graphics

description: Please see the README on GitHub at
  <https://github.com/jtnuttall/heph/tree/main/heph-aligned-storable#readme>
homepage: https://github.com/jtnuttall/heph/tree/main/heph-aligned-storable#readme

language: GHC2024

default-extensions:
  - BlockArguments

dependencies:
  - base >= 4.20 && < 5
  - half >= 0.3 && < 0.5
  - hashable >= 1.3 && < 1.6
  - unliftio ^>= 0.2
  - unliftio-core ^>= 0.2
  - vector >= 0.12.3.0 && < 0.14
  - vector-sized >= 1.4 && < 1.7

ghc-options:
  - -Wall
  - -Wcompat

library:
  source-dirs: src
  dependencies:
    - template-haskell >= 2.22 && < 2.25
  ghc-options:
    - -Widentities
    - -Wincomplete-record-updates
    - -Wincomplete-uni-patterns
    - -Wmissing-export-lists
    - -Wmissing-home-modules
    - -Wpartial-fields
    - -Wredundant-constraints
