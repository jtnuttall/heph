name: heph-aligned-storable-geomancy
version: 0.1.0.0
github: "jtnuttall/heph"
license: BSD-3-Clause
author: "Jeremy Nuttall"
maintainer: "jeremy@jeremy-nuttall.com"
copyright: "2025 Jeremy Nuttall"
tested-with: GHC == 9.14.1 || == 9.12.4 || == 9.10.3 || == 9.8.4

extra-source-files:
  - glsl/*.glsl

extra-doc-files:
  - README.md
  - CHANGELOG.md

# Metadata used when publishing your package
synopsis: AlignedStorable instances for geomancy's vectors and matrices
category: Graphics

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description: Please see the README on GitHub at
  <https://github.com/jtnuttall/heph/tree/main/heph-aligned-storable-geomancy#readme>
homepage: https://github.com/jtnuttall/heph/tree/main/heph-aligned-storable-geomancy#readme

dependencies:
  - base >= 4.19 && < 5
  - geomancy >= 0.4 && < 0.5
  - heph-aligned-storable >= 0.1 && < 0.3

ghc-options:
  - -Wall
  - -Wcompat

library:
  source-dirs: src
  dependencies:
    - template-haskell >= 2.21 && < 2.25
  ghc-options:
    - -Widentities
    - -Wincomplete-record-updates
    - -Wincomplete-uni-patterns
    - -Wmissing-export-lists
    - -Wmissing-home-modules
    - -Wpartial-fields
    - -Wredundant-constraints

tests:
  heph-aligned-storable-geomancy-test:
    main: Driver.hs
    source-dirs: test
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
      - -Wno-orphans
    dependencies:
      - heph-aligned-storable-geomancy
      - heph-aligned-storable-testlib >= 0.1 && < 0.2
      - hedgehog >= 1.0.4 && < 1.8
      - tasty >= 1.4.1 && < 1.6
      - tasty-discover >= 4.2.1 && < 6
      - tasty-inspection-testing >= 0.1 && < 0.3
    build-tools:
      - tasty-discover
